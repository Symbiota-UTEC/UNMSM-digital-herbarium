services:
  db:
    image: postgis/postgis:16-3.4
    container_name: herbarium_db
    environment:
      POSTGRES_USER: ${USERNAME:-herbarium}
      POSTGRES_PASSWORD: ${PASSWORD:-herbarium}
      POSTGRES_DB: ${DATABASE:-herbarium}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${USERNAME:-herbarium} -d ${DATABASE:-herbarium}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [appnet]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: herbarium_backend
    env_file:
      - backend/config/.env
    environment:
      - BACKEND_CORS_ALLOW_ORIGINS=${BACKEND_CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173,http://216.144.234.244:3000}
      - SEAWEEDFS_INTERNAL_URL=http://herbarium_seaweedfs:8888
      - SEAWEEDFS_PUBLIC_URL=${SEAWEEDFS_PUBLIC_URL:-http://localhost:8888}
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    command: ["sh", "-c", "python -m backend.scripts.create_models && python -m backend.scripts.create_admin && exec python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      # Chequea que el puerto acepte conexiones (sin hacer un request HTTP)
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('127.0.0.1', 8000)) == 0 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [appnet]

  backend-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: herbarium_backend_dev
    command: ["sh", "-c", "python -m backend.scripts.create_models && python -m backend.scripts.create_admin && exec python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app/backend
    env_file:
      - backend/config/.env
    environment:
      - PYTHONPATH=/app
      - BACKEND_CORS_ALLOW_ORIGINS=http://localhost:3000,http://localhost:5173
      - SEAWEEDFS_INTERNAL_URL=http://herbarium_seaweedfs:8888
      - SEAWEEDFS_PUBLIC_URL=${SEAWEEDFS_PUBLIC_URL:-http://localhost:8888}
    depends_on:
      db:
        condition: service_healthy
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('127.0.0.1', 8000)) == 0 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [appnet]

  frontend-dev:
    image: node:20-alpine
    container_name: herbarium_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8001/api
      - VITE_CAMERA_BASE_URL=${VITE_CAMERA_BASE_URL:-http://172.31.99.9:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend-dev:
        condition: service_healthy
    networks: [appnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Para desplegar a otro host, definir estas 2 en el .env de la raíz
        # (ver /.env.sample) en vez de editar este archivo.
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000/api}"
        VITE_CAMERA_BASE_URL: "${VITE_CAMERA_BASE_URL:-http://172.31.99.9:8000}"
    container_name: herbarium_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"   # http://localhost:3000
    networks: [appnet]

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: herbarium_seaweedfs
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8888:8888" # Filer UI
      - "8333:8333" # S3 API
    command: "server -dir=/data -s3"
    networks: [appnet]

volumes:
  pgdata:

networks:
  appnet:
