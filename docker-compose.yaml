services:
  db:
    image: postgis/postgis:16-3.5-alpine
    platform: linux/amd64
    container_name: herbarium_db
    environment:
      POSTGRES_USER: ${USERNAME:-herbarium}
      POSTGRES_PASSWORD: ${PASSWORD:-herbarium}
      POSTGRES_DB: ${DATABASE:-herbarium}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${USERNAME:-herbarium} -d ${DATABASE:-herbarium}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [appnet]

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: herbarium_seaweedfs
    command: "server -dir=/data -s3"
    volumes:
      - seaweeddata:/data
    networks: [appnet]

volumes:
  pgdata:
  seaweeddata:
    name: herbarium_seaweeddata

networks:
  appnet:
