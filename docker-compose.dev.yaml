services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  seaweedfs:
    ports:
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8333:8333"

  backend-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: herbarium_backend_dev
    command: ["sh", "-c", "exec python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app/backend
    env_file:
      - backend/config/.env
    environment:
      PYTHONPATH: /app
      HOST: db
      PORT: "5432"
      BACKEND_CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:5173
      SEAWEEDFS_INTERNAL_URL: http://herbarium_seaweedfs:8888
      SEAWEEDFS_PUBLIC_URL: ${SEAWEEDFS_PUBLIC_URL:-http://localhost:8888}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('127.0.0.1', 8000)) == 0 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [appnet]

  frontend-dev:
    image: node:20-alpine
    container_name: herbarium_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8001/api
      VITE_CAMERA_BASE_URL: ${VITE_CAMERA_BASE_URL:-http://172.31.99.9:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend-dev:
        condition: service_healthy
    networks: [appnet]
